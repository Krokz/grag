[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gragdb"
version = "0.8.0"
description = "Local-first, LLM-first graph knowledgebase: embedded Cypher engine, MCP tool contract, token-frugal GraphRAG retrieval"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    # Exact for storage/native compatibility. 0.20.3 keeps storage v47 and fixes
    # index/relationship/checkpoint defects; the Python C-API timeout bug remains.
    # Keep grag's connection-local timeout and prepared-plan safeguards. Qualify
    # the matching minor-version extension binaries on every supported platform.
    "ladybug==0.20.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pathspec>=0.12.1,<2",  # Git-compatible source ignores; pure Python
]

[project.optional-dependencies]
embed-local = ["fastembed>=0.4", "onnxruntime>=1.29"]  # 1.28.x segfaults multithreaded on macOS arm64
embed-remote = ["httpx>=0.27"]
# Tree-sitter grammars for the generic code parser (ts/js/cs/tf).
# Python parses via stdlib ast and never imports these.
# tree-sitter-language-pack adds bash/java/kotlin/rust/c/cpp/ruby/php/swift/lua/scala/sql.
code = ["tree-sitter>=0.23", "tree-sitter-python", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-c-sharp", "tree-sitter-hcl", "tree-sitter-go", "tree-sitter-language-pack>=1.16.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "pyyaml>=6.0", "ruff>=0.16", "mypy>=2.3"]

[project.scripts]
grag = "grag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grag"]
exclude = ["src/grag/_runtime"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# The built web UI lives in src/grag/api/static but is gitignored (it's a build
# artifact of ui/), so the default wheel omits it. Force-include it so a
# `pip install gragdb` ships the working UI. NOTE: force-include makes the dir
# REQUIRED at build time — so build the UI first (cd ui && npm ci && npm run
# build) before `pip install .` / `pip install -e .` / `python -m build`. CI and
# the publish workflow both do this; an editable install only *serves* the UI if
# it's been built.
[tool.hatch.build.targets.wheel.force-include]
"src/grag/api/static" = "grag/api/static"

[tool.hatch.build.targets.sdist]
# Don't let .gitignore exclude files from the sdist: src/grag/api/static is a
# gitignored *build artifact* that we DO ship when present. include (below)
# governs instead. The sdist lists it WITHOUT a trailing slash so it's an
# optional prefix (tolerated when absent); the wheel's force-include above is
# what *requires* it for distribution builds.
ignore-vcs = true
# Keep local UI dependencies out while still including the built web bundle.
exclude = ["/ui/node_modules", "/src/grag/_runtime"]
include = [
    "src/grag",
    "src/grag/api/static",
    "ui",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "hatch_build.py",
    "scripts/build_windows_runtime.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

# Explicit rule families: CI results must not depend on a contributor's
# machine-level ruff config or on new rules appearing in a future release's
# default set.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W",   # pycodestyle + pyflakes core
    "I",                          # import sorting
    "UP",                         # pyupgrade
    "B",                          # bugbear
    "SIM", "C4", "ISC", "RUF", "FURB", "PLW",
    "S", "BLE",                   # bandit + blind-except
    "DTZ", "PYI",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]  # asserts and urlopen-to-localhost are the test idiom

[tool.mypy]
# 3.12 grammar: numpy's stubs use `type` statements, unparseable below 3.12
# (follow_imports=skip still parses them). Runtime 3.10 compat is guarded by
# the CI test matrix, which runs the suite on 3.10.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true  # ladybug / fastembed / tree_sitter ship no stubs
