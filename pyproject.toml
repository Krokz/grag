[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gragdb"
version = "0.1.0"
description = "LLM-first graph knowledgebase: embedded Cypher engine, MCP tool contract, GraphRAG retrieval"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dependencies = [
    "ladybug>=0.19",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
embed-local = ["fastembed>=0.4"]
embed-remote = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
grag = "grag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grag"]

# The built web UI lives in src/grag/api/static but is gitignored (it's a build
# artifact of ui/), so the default wheel omits it. Force-include it so a
# `pip install gragdb` ships the working UI. The dir must exist at build time —
# the publish workflow builds the UI (npm run build) before `python -m build`.
[tool.hatch.build.targets.wheel.force-include]
"src/grag/api/static" = "grag/api/static"

[tool.hatch.build.targets.sdist]
# Don't let .gitignore exclude files from the sdist: src/grag/api/static is a
# gitignored *build artifact* that we DO ship. include (below) governs instead.
ignore-vcs = true
# Include the UI source (ui/) AND the built bundle (src/grag/api/static). The
# wheel is built from the sdist by `python -m build`, so the static dir must be
# in the sdist for the wheel's force-include (above) to find it.
include = [
    "src/grag",
    "src/grag/api/static",
    "ui",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
