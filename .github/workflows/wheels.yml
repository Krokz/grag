name: Clean wheel install

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  wheel:
    name: Clean wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - if: runner.os == 'Windows'
        uses: ./.github/actions/windows-runtime
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install into clean environment and run native/CLI/MCP smoke
        run: python scripts/smoke_wheel.py --code
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Windows oldest supported Python
        if: runner.os == 'Windows'
        run: python scripts/smoke_wheel.py
      - if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Windows newest supported Python
        if: runner.os == 'Windows'
        run: python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: grag-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7
