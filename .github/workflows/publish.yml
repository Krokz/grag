name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-ui:
    name: Build web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        # Emits the bundle to src/grag/api/static (per ui/vite.config.ts).
        run: |
          npm ci
          npm run build

      - name: Upload built UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: grag-ui-static
          path: src/grag/api/static
          retention-days: 1

  test:
    name: Gate on pytest
    runs-on: ubuntu-latest
    needs: [build-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # pip install requires the built UI (wheel force-include); pull the
      # artifact produced by build-ui rather than rebuilding it here.
      - name: Download built UI into src/grag/api/static
        uses: actions/download-artifact@v4
        with:
          name: grag-ui-static
          path: src/grag/api/static

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch LadybugDB extensions (cache-busting; verify build generation)
        # FTS/VECTOR are downloaded from extension.ladybugdb.com on first use and
        # keyed by MINOR version (v0.20.0/), so a republish for a new patch wheel
        # replaces them in place. After the 0.20.2 republish Cloudflare edges kept
        # serving the old binaries to some runners (cache HIT, ETag 6a9306b5…)
        # and the new ones to others (ETag 6a975e…); a wheel/extension mismatch
        # segfaults inside ladybug. Fetch with a cache-busting query so the edge
        # revalidates, insist on the current generation, and pre-place the files
        # — ladybug's INSTALL leaves an existing file alone.
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) plat=linux_amd64 ;; macOS) plat=osx_arm64 ;; Windows) plat=win_amd64 ;;
          esac
          base="$HOME/.lbdb/extension/0.20.0/$plat"
          for ext in fts vector; do
            mkdir -p "$base/$ext"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              url="https://extension.ladybugdb.com/v0.20.0/$plat/$ext/lib$ext.lbug_extension?bust=$RANDOM$RANDOM$attempt"
              if curl -fsSL "$url" -D hdr.txt -o "$base/$ext/lib$ext.lbug_extension" \
                 && grep -qiE '^etag: "6a975e' hdr.txt; then ok=1; break; fi
              echo "attempt $attempt: $(grep -i '^etag' hdr.txt | tr -d '\r')"; sleep $((attempt * 5))
            done
            [ "$ok" = 1 ] || { echo "::error::CDN kept serving a pre-0.20.2 $ext extension for $plat"; exit 1; }
            echo "$ext: $(grep -i '^etag' hdr.txt | tr -d '\r') $(wc -c < "$base/$ext/lib$ext.lbug_extension") bytes"
          done

      - name: Warm LadybugDB extensions (with retries)
        shell: bash
        run: |
          python - <<'PY'
          import shutil, sys, tempfile, time
          from pathlib import Path
          from grag.config import GragConfig
          from grag.core.engine import Engine
          for attempt in range(1, 6):
              tmp = Path(tempfile.mkdtemp())
              try:
                  eng = Engine(GragConfig(db_path=tmp / "warm.lbdb"))
                  try:
                      for name in ("FTS", "VECTOR"):
                          eng.load_extension(name)
                  finally:
                      eng.close()
                  print("extensions ready")
                  break
              except Exception as exc:  # noqa: BLE001
                  print(f"attempt {attempt} failed: {exc}", file=sys.stderr)
                  time.sleep(5 * attempt)
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
          else:
              sys.exit("could not install LadybugDB extensions after 5 attempts")
          PY

      - name: Run tests
        run: pytest

  build-dist:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [build-ui, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Download built UI into src/grag/api/static
        uses: actions/download-artifact@v4
        with:
          name: grag-ui-static
          path: src/grag/api/static

      - name: Resolve tag name
        id: tag
        run: |
          # On release events GITHUB_REF is not the tag, so prefer the release's tag.
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Guard: tag matches pyproject version"
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          echo "tag: $TAG"
          case "$TAG" in
            v*) : ;;
            *) echo "::error::Tag '$TAG' must start with 'v' (e.g. v0.2.0)."; exit 1;;
          esac
          TAGVER="${TAG#v}"
          PKGVER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $PKGVER"
          if [ "$TAGVER" != "$PKGVER" ]; then
            echo "::error::Tag version '$TAGVER' != pyproject version '$PKGVER'. Bump version before tagging."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Verify UI is inside the wheel
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          w = glob.glob('dist/*.whl')[0]
          ok = any('grag/api/static/index.html' in n for n in zipfile.ZipFile(w).namelist())
          print('wheel contains UI index.html:', ok)
          sys.exit(0 if ok else 1)
          PY

      - name: twine check
        run: twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: grag-dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI (OIDC)
    runs-on: ubuntu-latest
    needs: [build-dist]
    environment:
      name: pypi
      url: https://pypi.org/p/gragdb
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: grag-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password: uses the OIDC trusted publisher configured on PyPI.
