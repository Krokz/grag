name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows and macOS get one representative Python each: wide
          # per-version coverage comes from the Linux axis, these two guard
          # platform-specific paths (paths, pidfiles, daemon spawn, perms).
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Build the UI BEFORE pip install: the wheel's force-include requires
      # src/grag/api/static to exist at build/install time (see pyproject.toml).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI (emits src/grag/api/static)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Provide OpenSSL DLLs for ladybug (Windows)
        # The ladybug win wheel's native extension links libssl-3-x64.dll /
        # libcrypto-3-x64.dll but the wheel does not bundle them (upstream
        # packaging gap). Copy the runner's OpenSSL 3 DLLs into the wheel's
        # ladybug.libs dir, which ladybug's delvewheel patch adds to the DLL
        # search path — then verify the native backend actually imports.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libs = Join-Path (python -c "import ladybug, pathlib; print(pathlib.Path(ladybug.__file__).parent.parent)") 'ladybug.libs'
          $roots = @("$env:ProgramFiles\OpenSSL", "$env:ProgramFiles\OpenSSL-Win64", 'C:\Strawberry\c\bin')
          foreach ($name in 'libssl-3-x64.dll', 'libcrypto-3-x64.dll') {
            $dll = Get-ChildItem -Path $roots -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) {
              choco install openssl -y --no-progress | Out-Null
              $dll = Get-ChildItem -Path $roots -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $dll) { throw "$name not found on runner" }
            Copy-Item $dll.FullName $libs
            Write-Host "copied $($dll.FullName) -> $libs"
          }
          python -c "import ladybug._lbug; print('ladybug native backend OK')"

      - name: Cache LadybugDB extensions
        # FTS/VECTOR are downloaded from extension.ladybugdb.com on first use.
        # A slow or flaky CDN otherwise turns into multi-minute stalls (or, on
        # Windows, an access violation on LOAD of a partial download) inside
        # pytest. Cache the store across runs and warm it explicitly below.
        uses: actions/cache@v4
        with:
          path: ~/.lbdb/extension
          key: lbdb-ext-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Warm LadybugDB extensions (with retries)
        shell: bash
        run: |
          python - <<'PY'
          import shutil, sys, tempfile, time
          from pathlib import Path
          from grag.config import GragConfig
          from grag.core.engine import Engine
          for attempt in range(1, 6):
              tmp = Path(tempfile.mkdtemp())
              try:
                  eng = Engine(GragConfig(db_path=tmp / "warm.lbdb"))
                  try:
                      for name in ("FTS", "VECTOR"):
                          eng.load_extension(name)
                  finally:
                      eng.close()
                  print("extensions ready")
                  break
              except Exception as exc:  # noqa: BLE001
                  print(f"attempt {attempt} failed: {exc}", file=sys.stderr)
                  time.sleep(5 * attempt)
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
          else:
              sys.exit("could not install LadybugDB extensions after 5 attempts")
          PY

      - name: Run tests
        run: pytest

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        # Editable install so mypy checks against real dependency types; the
        # empty static dir satisfies the wheel force-include without a UI build.
        run: |
          mkdir -p src/grag/api/static
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy src/grag

  ui:
    name: UI build (typecheck + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        # npm run build = tsc --noEmit && vite build (type-checks, then bundles).
        run: |
          npm ci
          npm run build
