name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Build the UI BEFORE pip install: the wheel's force-include requires
      # src/grag/api/static to exist at build/install time (see pyproject.toml).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI (emits src/grag/api/static)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # LadybugDB downloads FTS/VECTOR extensions on first use; CI has network.
        run: pytest

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        # Editable install so mypy checks against real dependency types; the
        # empty static dir satisfies the wheel force-include without a UI build.
        run: |
          mkdir -p src/grag/api/static
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy src/grag

  ui:
    name: UI build (typecheck + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        # npm run build = tsc --noEmit && vite build (type-checks, then bundles).
        run: |
          npm ci
          npm run build
