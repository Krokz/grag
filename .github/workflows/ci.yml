name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows and macOS get one representative Python each: wide
          # per-version coverage comes from the Linux axis, these two guard
          # platform-specific paths (paths, pidfiles, daemon spawn, perms).
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Build the UI BEFORE pip install: the wheel's force-include requires
      # src/grag/api/static to exist at build/install time (see pyproject.toml).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI (emits src/grag/api/static)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Provide OpenSSL DLLs for ladybug (Windows)
        # The ladybug win wheel's native extension links libssl-3-x64.dll /
        # libcrypto-3-x64.dll but the wheel does not bundle them (upstream
        # packaging gap). Copy the runner's OpenSSL 3 DLLs into the wheel's
        # ladybug.libs dir, which ladybug's delvewheel patch adds to the DLL
        # search path — then verify the native backend actually imports.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libs = Join-Path (python -c "import ladybug, pathlib; print(pathlib.Path(ladybug.__file__).parent.parent)") 'ladybug.libs'
          $roots = @("$env:ProgramFiles\OpenSSL", "$env:ProgramFiles\OpenSSL-Win64", 'C:\Strawberry\c\bin')
          foreach ($name in 'libssl-3-x64.dll', 'libcrypto-3-x64.dll') {
            $dll = Get-ChildItem -Path $roots -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) {
              choco install openssl -y --no-progress | Out-Null
              $dll = Get-ChildItem -Path $roots -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $dll) { throw "$name not found on runner" }
            Copy-Item $dll.FullName $libs
            Write-Host "copied $($dll.FullName) -> $libs"
          }
          python -c "import ladybug._lbug; print('ladybug native backend OK')"

      - name: Fetch LadybugDB extensions (cache-busting; verify build generation)
        # FTS/VECTOR are downloaded from extension.ladybugdb.com on first use and
        # keyed by MINOR version (v0.20.0/), so a republish for a new patch wheel
        # replaces them in place. After the 0.20.2 republish Cloudflare edges kept
        # serving the old binaries to some runners (cache HIT, ETag 6a9306b5…)
        # and the new ones to others (ETag 6a975e…); a wheel/extension mismatch
        # segfaults inside ladybug. Fetch with a cache-busting query so the edge
        # revalidates, insist on the current generation, and pre-place the files
        # — ladybug's INSTALL leaves an existing file alone.
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) plat=linux_amd64 ;; macOS) plat=osx_arm64 ;; Windows) plat=win_amd64 ;;
          esac
          base="$HOME/.lbdb/extension/0.20.0/$plat"
          for ext in fts vector; do
            mkdir -p "$base/$ext"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              url="https://extension.ladybugdb.com/v0.20.0/$plat/$ext/lib$ext.lbug_extension?bust=$RANDOM$RANDOM$attempt"
              if curl -fsSL "$url" -D hdr.txt -o "$base/$ext/lib$ext.lbug_extension" \
                 && grep -qiE '^etag: "6a975e' hdr.txt; then ok=1; break; fi
              echo "attempt $attempt: $(grep -i '^etag' hdr.txt | tr -d '\r')"; sleep $((attempt * 5))
            done
            [ "$ok" = 1 ] || { echo "::error::CDN kept serving a pre-0.20.2 $ext extension for $plat"; exit 1; }
            echo "$ext: $(grep -i '^etag' hdr.txt | tr -d '\r') $(wc -c < "$base/$ext/lib$ext.lbug_extension") bytes"
          done

      - name: Warm LadybugDB extensions (with retries)
        shell: bash
        run: |
          python - <<'PY'
          import shutil, sys, tempfile, time
          from pathlib import Path
          from grag.config import GragConfig
          from grag.core.engine import Engine
          for attempt in range(1, 6):
              tmp = Path(tempfile.mkdtemp())
              try:
                  eng = Engine(GragConfig(db_path=tmp / "warm.lbdb"))
                  try:
                      for name in ("FTS", "VECTOR"):
                          eng.load_extension(name)
                  finally:
                      eng.close()
                  print("extensions ready")
                  break
              except Exception as exc:  # noqa: BLE001
                  print(f"attempt {attempt} failed: {exc}", file=sys.stderr)
                  time.sleep(5 * attempt)
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)
          else:
              sys.exit("could not install LadybugDB extensions after 5 attempts")
          PY

      - name: Run tests
        run: pytest

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        # Editable install so mypy checks against real dependency types; the
        # empty static dir satisfies the wheel force-include without a UI build.
        run: |
          mkdir -p src/grag/api/static
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy src/grag

  ui:
    name: UI build (typecheck + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and build
        # npm run build = tsc --noEmit && vite build (type-checks, then bundles).
        run: |
          npm ci
          npm run build
