site_name: grag
site_description: Local graph memory for AI agents — code, documents and decisions.
site_url: https://krokz.github.io/grag/
repo_url: https://github.com/Krokz/grag
repo_name: Krokz/grag
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

plugins:
  - search:
      # Find identifiers and flags inside code expressions as well as prose.
      separator: '[\s\-._=:/"]+'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - First session: getting-started.md
      - Installation and Windows: installation.md
  - Guides:
      - guides/index.md
      - Index code: guides/code.md
      - Select sources and ignores: guides/source-scope.md
      - Index documents: guides/documents.md
      - Save and revise memory: guides/memory.md
      - History and evidence: guides/history.md
      - Resume work: guides/resume.md
      - Retrieve context: guides/retrieval.md
      - Code freshness: guides/freshness.md
      - Optional embeddings: guides/embeddings.md
      - Projects and relocation: guides/projects.md
  - Operate:
      - operations/index.md
      - Servers and multiple clients: operations/server.md
      - Troubleshooting: operations/troubleshooting.md
      - Installation and client diagnostics: operations/diagnostics.md
      - Backup and recovery: operations/recovery.md
  - Reference:
      - reference/index.md
      - MCP tools: reference/mcp.md
      - Python and REST: reference/python-rest.md
      - CLI commands: reference/cli.md
      - Configuration: reference/configuration.md
      - Schema conventions: reference/schema.md
      - Writes and retries: reference/mutations.md
      - Language support:
          - reference/languages/index.md
          - Python: reference/languages/python.md
          - JavaScript and frameworks: reference/languages/javascript.md
          - Go: reference/languages/go.md
          - Java and C# identities: reference/languages/overloads.md
      - Resource limits: reference/limits.md
  - Architecture: architecture.md
  - Development: development.md
